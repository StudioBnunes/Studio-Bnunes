<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Studio BNunes</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- ÍCONES -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #FAF7F2, #EFE3D8);
            color: #5A4A45;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 20px 15px;
        }

        .card {
            background: #FBF9F6;
            border-radius: 25px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(110, 80, 65, 0.12);
        }

        /* LOGO */

        .logo {
            text-align: center;
            padding: 5px 0 10px;
        }

        .logo img {
            width: 100%;
            max-width: 360px;
            height: auto;
            display: block;
            margin: auto;
        }

        /* INSTAGRAM */

        .instagram {
            display: block;
            text-align: center;
            margin: 12px 0 28px;
            padding: 14px;
            border-radius: 12px;
            background: #F4EAE6;
            color: #9B6570;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            border: 1px solid #E6D3CE;
            transition: 0.2s;
        }

        .instagram:hover {
            background: #EEDFD9;
        }

        .instagram i {
            font-size: 18px;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* TÍTULO */

        .titulo {
            text-align: center;
            color: #8F5C67;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 25px 0 18px;
        }

        /* SERVIÇOS */

        .servicos {
            border: 1px solid #E6D8D2;
            border-radius: 15px;
            overflow: hidden;
            background: #FBF9F6;
        }

        .servico {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 14px;
            border-bottom: 1px solid #EEE5E0;
            gap: 10px;
        }

        .servico:last-child {
            border-bottom: none;
        }

        .servico span:first-child {
            font-size: 14px;
            color: #5F504B;
        }

        .preco {
            color: #9B5D6B;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            white-space: nowrap;
        }

        /* FORMULÁRIO */

        label {
            display: block;
            margin-top: 21px;
            margin-bottom: 7px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #67514C;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #DDCCC5;
            border-radius: 12px;
            background: #FFFFFF;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #5A4A45;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #B9828D;
            box-shadow: 0 0 0 2px rgba(185, 130, 141, 0.10);
        }

        /* HORÁRIOS */

        .horarios {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .horario {
            padding: 13px 5px;
            background: #FFFFFF;
            border: 1px solid #DDCCC5;
            border-radius: 10px;
            color: #67514C;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .horario:hover:not(:disabled) {
            background: #F4EAE6;
            border-color: #C9A3A9;
        }

        .horario.selecionado {
            background: #A96F7B;
            color: #FFFFFF;
            border-color: #A96F7B;
        }

        .horario.ocupado,
        .horario:disabled {
            background: #E5E0DD;
            color: #99908C;
            border-color: #D5CECA;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* BOTÃO */

        .botao {
            width: 100%;
            border: none;
            margin-top: 26px;
            padding: 16px;
            border-radius: 12px;
            background: #A96F7B;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .botao:hover {
            background: #8F5C67;
        }

        .botao:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .botao i {
            font-size: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* LOCALIZAÇÃO */

        .localizacao {
            text-align: center;
            margin-top: 27px;
            color: #9B6570;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 14px;
        }

        .localizacao a {
            color: #9B6570;
            text-decoration: none;
        }

        /* AVISO */

        .aviso {
            margin-top: 15px;
            text-align: center;
            font-size: 11px;
            font-weight: 300;
            color: #917C76;
        }

        /* MENSAGEM */

        .mensagem {
            display: none;
            margin-top: 15px;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .mensagem.erro {
            display: block;
            background: #F8E7E7;
            color: #9A4F4F;
            border: 1px solid #E8CACA;
        }

        .mensagem.sucesso {
            display: block;
            background: #E8F4EA;
            color: #47744D;
            border: 1px solid #C9E1CC;
        }

        /* CELULAR */

        @media (max-width: 380px) {

            .container {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .horarios {
                grid-template-columns: repeat(2, 1fr);
            }

            .titulo {
                font-size: 16px;
                letter-spacing: 1.5px;
            }

        }

    </style>

</head>


<body>

<div class="container">

        <!-- INSTAGRAM -->

        <!-- TÍTULO -->

        <h2 class="titulo">

        <!-- SERVIÇOS -->

        <div class="servicos">

            <div class="servico">

            <option value="Manicure - R$ 25,00">

            <button type="button" class="horario">

            </button>

            <button type="button" class="horario">
                13:00
            </button>

            <button type="button" class="horario">
                14:00
            </button>

            <button type="button" class="horario">
                15:00

            <button type="button" class="horario">

        <!-- BOTÃO -->

            Confirmar agendamento

        <!-- MENSAGEM -->

            id="mensagem"

<script>

/* =====================================================
   CONFIGURAÇÃO SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://gdkkklxhrtsfdcgypjwd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_uUi42l6DTYB1fGSog67yAg_RMkoOZAt";


/* =====================================================
   VARIÁVEIS
===================================================== */

let horarioSelecionado = "";

let horariosOcupados = [];


/* =====================================================
   ELEMENTOS
===================================================== */

const campoData =
    document.getElementById("data");

const botoesHorario =
    document.querySelectorAll(".horario");

const mensagem =
    document.getElementById("mensagem");

const botaoAgendar =
    document.getElementById("botaoAgendar");


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(texto, tipo) {

    mensagem.innerHTML = texto;

    mensagem.className =
        "mensagem " + tipo;

}


/* =====================================================
   SELECIONAR HORÁRIO
===================================================== */

botoesHorario.forEach(function(botao) {

    botao.addEventListener("click", function() {

        if (botao.disabled) {
            return;
        }

        botoesHorario.forEach(function(item) {

            item.classList.remove("selecionado");

        });

        botao.classList.add("selecionado");

        horarioSelecionado =
            botao.dataset.horario;

    });

});


/* =====================================================
   PREPARAR HORÁRIOS
===================================================== */

botoesHorario.forEach(function(botao) {

    botao.dataset.horario =
        botao.textContent.trim();

});


/* =====================================================
   CARREGAR HORÁRIOS OCUPADOS
===================================================== */

async function carregarHorarios() {

    const data = campoData.value;

    horarioSelecionado = "";

    horariosOcupados = [];


    /*
       Limpa todos os botões
    */

    botoesHorario.forEach(function(botao) {

        botao.disabled = false;

        botao.classList.remove("ocupado");

        botao.classList.remove("selecionado");

        botao.textContent =
            botao.dataset.horario;

    });


    if (!data) {
        return;
    }


    mostrarMensagem(
        "Verificando horários disponíveis...",
        "sucesso"
    );


    try {

        /*
           Busca os agendamentos da data escolhida.
        */

        const url =
            `${SUPABASE_URL}/rest/v1/agendamentos` +
            `?data=eq.${encodeURIComponent(data)}` +
            `&select=horario`;


        const resposta =
            await fetch(url, {

                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,

                    "Content-Type":
                        "application/json"

                }

            });


        if (!resposta.ok) {

            const erro =
                await resposta.text();

            console.error(
                "Erro Supabase:",
                erro
            );

            throw new Error(
                "Não foi possível consultar os horários."
            );

        }


        const dados =
            await resposta.json();


        /*
           Guarda os horários ocupados.
        */

        horariosOcupados =
            dados
            .map(function(item) {

                return String(
                    item.horario
                ).trim();

            });


        /*
           Bloqueia os horários ocupados.
        */

        botoesHorario.forEach(function(botao) {

            const horario =
                botao.dataset.horario;


            if (
                horariosOcupados.includes(horario)
            ) {

                botao.disabled = true;

                botao.classList.add(
                    "ocupado"
                );

                botao.textContent =
                    `${horario} • OCUPADO`;

            }

        });


        mostrarMensagem(
            "Horários disponíveis carregados.",
            "sucesso"
        );


        setTimeout(function() {

            mensagem.className =
                "mensagem";

            mensagem.innerHTML = "";

        }, 2500);


    } catch (erro) {

        console.error(erro);

        mostrarMensagem(
            "Não foi possível carregar os horários. Verifique a conexão com o sistema.",
            "erro"
        );

    }

}


/* =====================================================
   VERIFICAR SE O HORÁRIO AINDA ESTÁ LIVRE
===================================================== */

async function verificarHorarioDisponivel(
    data,
    horario
) {

    const url =
        `${SUPABASE_URL}/rest/v1/agendamentos` +
        `?data=eq.${encodeURIComponent(data)}` +
        `&horario=eq.${encodeURIComponent(horario)}` +
        `&select=id`;


    const resposta =
        await fetch(url, {

            method: "GET",

            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    `Bearer ${SUPABASE_KEY}`

            }

        });


    if (!resposta.ok) {

        throw new Error(
            "Não foi possível verificar o horário."
        );

    }


    const dados =
        await resposta.json();


    return dados.length === 0;

}


/* =====================================================
   SALVAR AGENDAMENTO
===================================================== */

async function salvarAgendamento(
    nome,
    telefone,
    servico,
    data,
    horario
) {

    const resposta =
        await fetch(

            `${SUPABASE_URL}/rest/v1/agendamentos`,

            {

                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=representation"

                },

                body:
                    JSON.stringify({

                        nome:
                            nome,

                        telefone:
                            telefone,

                        servico:
                            servico,

                        data:
                            data,

                        horario:
                            horario

                    })

            }

        );


    if (!resposta.ok) {

        const erro =
            await resposta.text();

        console.error(
            "Erro ao salvar:",
            erro
        );

        /*
           409 normalmente significa
           conflito de registro.
        */

        if (resposta.status === 409) {

            throw new Error(
                "Esse horário acabou de ser reservado por outra cliente."
            );

        }

        throw new Error(
            "Não foi possível salvar o agendamento."
        );

    }


    return true;

}


/* =====================================================
   CONFIRMAR AGENDAMENTO
===================================================== */

async function confirmarAgendamento() {

    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const telefone =
        document
        .getElementById("telefone")
        .value
        .trim();


    const servico =
        document
        .getElementById("servico")
        .value;


    const data =
        campoData.value;


    /*
       Valida nome
    */

    if (!nome) {

        mostrarMensagem(
            "Digite o nome da cliente.",
            "erro"
        );

        return;

    }


    /*
       Valida WhatsApp
    */

    if (!telefone) {

        mostrarMensagem(
            "Digite o WhatsApp da cliente.",
            "erro"
        );

        return;

    }


    /*
       Valida serviço
    */

    if (!servico) {

        mostrarMensagem(
            "Escolha o serviço desejado.",
            "erro"
        );

        return;

    }


    /*
       Valida data
    */

    if (!data) {

        mostrarMensagem(
            "Escolha uma data.",
            "erro"
        );

        return;

    }


    /*
       Valida horário
    */

    if (!horarioSelecionado) {

        mostrarMensagem(
            "Escolha um horário.",
            "erro"
        );

        return;

    }


    /*
       Desabilita botão
    */

    botaoAgendar.disabled = true;

    botaoAgendar.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Reservando...';


    try {

        /*
           Verifica novamente no banco.
           Isso evita que duas pessoas
           reservem o mesmo horário.
        */

        const disponivel =
            await verificarHorarioDisponivel(
                data,
                horarioSelecionado
            );


        if (!disponivel) {

            mostrarMensagem(
                "Esse horário acabou de ser ocupado. Escolha outro horário.",
                "erro"
            );

            await carregarHorarios();

            return;

        }


        /*
           Salva no Supabase
        */

        await salvarAgendamento(

            nome,

            telefone,

            servico,

            data,

            horarioSelecionado

        );


        /*
           Formata data
        */

        const dataFormatada =
            data
            .split("-")
            .reverse()
            .join("/");


        /*
           Mensagem para WhatsApp
        */

        const textoWhatsApp =

            `Olá! Gostaria de confirmar meu agendamento no Studio BNunes.%0A%0A` +

            `Nome: ${encodeURIComponent(nome)}%0A` +

            `WhatsApp: ${encodeURIComponent(telefone)}%0A` +

            `Serviço: ${encodeURIComponent(servico)}%0A` +

            `Data: ${encodeURIComponent(dataFormatada)}%0A` +

            `Horário: ${encodeURIComponent(horarioSelecionado)}`;


        const numeroWhatsApp =
            "5547933891418";


        const whatsappUrl =
            `https://wa.me/${numeroWhatsApp}?text=${textoWhatsApp}`;


        /*
           Mensagem de sucesso
        */

        mostrarMensagem(

            `Agendamento realizado com sucesso!<br><br>
             <strong>${dataFormatada}</strong><br>
             <strong>${horarioSelecionado}</strong><br><br>
             Você será direcionada para o WhatsApp.`,

            "sucesso"

        );


        /*
           Atualiza os horários
        */

        await carregarHorarios();


        /*
           Abre WhatsApp
        */

        setTimeout(function() {

            window.open(
                whatsappUrl,
                "_blank"
            );

        }, 700);


    } catch (erro) {

        console.error(
            "Erro no agendamento:",
            erro
        );


        mostrarMensagem(

            erro.message ||
            "Não foi possível realizar o agendamento.",

            "erro"

        );


    } finally {

        botaoAgendar.disabled = false;

        botaoAgendar.innerHTML =
            '<i class="fa-solid fa-calendar-check"></i> Confirmar agendamento';

    }

}


/* =====================================================
   BOTÃO
===================================================== */

botaoAgendar.addEventListener(
    "click",
    confirmarAgendamento
);


/* =====================================================
   QUANDO ESCOLHER DATA
===================================================== */

campoData.addEventListener(
    "change",
    carregarHorarios
);


/* =====================================================
   IMPEDIR DATA PASSADA
===================================================== */

const hoje =
    new Date();

const ano =
    hoje.getFullYear();

const mes =
    String(
        hoje.getMonth() + 1
    ).padStart(
        2,
        "0"
    );

const dia =
    String(
        hoje.getDate()
    ).padStart(
        2,
        "0"
    );

campoData.min =
    `${ano}-${mes}-${dia}`;


/* =====================================================
